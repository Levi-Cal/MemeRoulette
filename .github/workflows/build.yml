# Builds Meme Roulette for Android (APK) and Windows (installer + portable .exe)
# and publishes them together as one Release. Sign in to GitHub to download.
name: Build Meme Roulette

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk ../MemeRoulette.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: MemeRoulette.apk

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Copy the shared viewer into the app
        run: Copy-Item -Recurse ../web ./web
        shell: pwsh
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build Windows app
        run: npx electron-builder --win nsis portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            desktop/dist/MemeRoulette-Setup.exe
            desktop/dist/MemeRoulette-Portable.exe

  release:
    needs: [ android, windows ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: memeroulette-${{ github.run_number }}
          name: Meme Roulette ${{ github.run_number }}
          make_latest: true
          files: |
            out/MemeRoulette.apk
            out/MemeRoulette-Setup.exe
            out/MemeRoulette-Portable.exe
          body: |
            **Phone:** download `MemeRoulette.apk` on your Android phone and open it to install.
            **Windows:** `MemeRoulette-Setup.exe` installs it; `MemeRoulette-Portable.exe` runs without installing.
            Windows may say the app is unrecognized (it isn't code-signed): click **More info → Run anyway**.
